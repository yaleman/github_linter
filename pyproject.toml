
[project]
version = "0.0.6"
name = "github_linter"
authors = [{ name = "James Hodgkinson", email = "james@terminaloutcomes.com" }]
classifiers = ["License :: OSI Approved :: MIT License"]
readme = "README.md"

keywords = ["github"]

requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "github3-py>=4.0.1",
    "greenlet>=3.5.6",
    "jinja2>=3.1.6",
    "json5>=0.15.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pygithub>=2.10.0",
    "python-hcl2>=8.1.4",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruyaml>=0.91.0",
    "semver>=3.1.0",
    "sqlalchemy>=2.1.3",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
    "wildcard-matcher>=0.0.3",
]

[project.urls]
Home = "https://github.com/yaleman/github_linter"

[project.optional-dependencies]
dev = ["flit", "pytest", "mypy", "types-PyYAML", "types-pytz"]

[project.scripts]
"github-linter" = 'github_linter.__main__:cli'
"github-linter-web" = 'github_linter.web.__main__:cli'


[tool.ruff]
line-length = 200
exclude = ["W0511", "consider-using-dict-items", "duplicate-code"]

[tool.pytest.ini_options]
markers = ["network: things which need authentication, '-m \"not network\"'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "coveralls>=4.1.0",
    "flit>=4.1.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "types-pytz>=2026.5.0.20261006",
    "ruff>=0.16.10",
    "ty>=0.0.85",
    "types-pytz>=2026.3.1.20260727",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
    "pytest-asyncio>=1.4.0",
]
